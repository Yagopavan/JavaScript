<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno</title>
</head>
<body style="background-color: lightgreen; align-items: center; text-align: center; font-family: Arial, sans-serif;">
    <h1 id="titulo">Cadastro de Aluno</h1>

    <input id="nome" type="text" placeholder="Nome" style="border-radius: 8px; background-color: lightgray;"><br><br>
    <input id="idade" type="number" placeholder="Idade" style="border-radius: 8px; background-color: lightgray;"><br><br>
    <input id="curso" type="text" placeholder="Curso" style="border-radius: 8px; background-color: lightgray;"><br><br>
    <input id="matricula" type="text" placeholder="Matrícula" style="border-radius: 8px; background-color: lightgray;"><br><br>

    <button id="botaoCadastrar" style="border-radius: 8px;">
        Cadastrar
    </button>

    <div id="resultado"></div>

    <script src="script.js"></script>
</body>
</html>
