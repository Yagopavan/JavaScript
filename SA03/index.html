<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoNews</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1> AutoNews</h1>
        <p>Notícias do mundo automotivo</p>
    </header>

    <main>

        <section class="pesquisa">
            <input
                type="text"
                id="campoPesquisa"
                placeholder="Digite uma marca ou assunto..."
            >

            <button id="btnPesquisar">
                Pesquisar
            </button>
        </section>

        <section>
            <h2>Últimas notícias</h2>

            <div id="noticias"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
